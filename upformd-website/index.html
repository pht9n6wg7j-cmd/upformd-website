<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPFORMD — Coming Soon</title>
<meta name="description" content="UPFORMD. Something is taking form. München, 2026.">
<meta name="theme-color" content="#ffffff">
<link rel="preload" href="fonts/archivo-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<style>
  :root{
    --bg:#ffffff;
    --ink:#0a0a0a;
    --mute:#8a8a8a;
    --line:#e6e6e6;
    --pad:clamp(16px,3vw,40px);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{background:var(--ink);color:var(--bg)}
  a{color:inherit;text-decoration:none}

  /* Raster im Hintergrund */
  .grid{
    position:fixed;inset:0;pointer-events:none;z-index:0;
    display:grid;grid-template-columns:repeat(4,1fr);
    padding:0 var(--pad);
  }
  .grid span{border-left:1px solid var(--line);transform:scaleY(0);transform-origin:top;animation:draw 1.4s cubic-bezier(.7,0,.2,1) forwards}
  .grid span:last-child{border-right:1px solid var(--line)}
  .grid span:nth-child(2){animation-delay:.08s}
  .grid span:nth-child(3){animation-delay:.16s}
  .grid span:nth-child(4){animation-delay:.24s}
  @keyframes draw{to{transform:scaleY(1)}}

  .page{
    position:relative;z-index:1;
    min-height:100vh;min-height:100svh;
    display:grid;grid-template-rows:auto 1fr auto auto;
  }

  /* Kopfzeile */
  header{
    display:grid;grid-template-columns:repeat(4,1fr);
    padding:var(--pad);gap:0;
  }
  header > *{padding-left:10px;opacity:0;animation:fade .8s ease forwards .9s}
  .mark{font-weight:500;color:var(--ink)}
  .dim{color:var(--mute)}

  /* Hauptbereich */
  main{
    display:flex;flex-direction:column;justify-content:center;
    padding:0 var(--pad);
  }
  .index{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:0 10px 18px;
  }
  .index > *{opacity:0;animation:fade .8s ease forwards 1.1s}

  h1{
    font-family:'Archivo',sans-serif;font-weight:900;
    font-size:clamp(52px,16.2vw,260px);
    line-height:.82;letter-spacing:-.045em;
    text-transform:uppercase;
    display:flex;overflow:hidden;
    padding:0 0 .04em;
    margin-left:-.04em;
  }
  h1 span{
    display:inline-block;transform:translateY(105%);
    animation:rise 1.1s cubic-bezier(.2,.8,.1,1) forwards;
  }
  h1 span:nth-child(1){animation-delay:.30s}
  h1 span:nth-child(2){animation-delay:.36s}
  h1 span:nth-child(3){animation-delay:.42s}
  h1 span:nth-child(4){animation-delay:.48s}
  h1 span:nth-child(5){animation-delay:.54s}
  h1 span:nth-child(6){animation-delay:.60s}
  h1 span:nth-child(7){animation-delay:.66s}
  @keyframes rise{to{transform:translateY(0)}}

  .rule{
    height:1px;background:var(--ink);margin-top:22px;
    transform:scaleX(0);transform-origin:left;
    animation:grow 1.2s cubic-bezier(.7,0,.2,1) forwards 1s;
  }
  @keyframes grow{to{transform:scaleX(1)}}

  .sub{
    display:grid;grid-template-columns:repeat(4,1fr);
    padding-top:18px;
  }
  .sub > *{padding-left:10px;opacity:0;animation:fade .8s ease forwards 1.5s}
  .tagline{
    grid-column:span 2;
    font-family:'Archivo',sans-serif;font-weight:300;
    font-size:clamp(18px,2.2vw,30px);letter-spacing:-.01em;text-transform:none;
    line-height:1.15;
  }
  .cursor{display:inline-block;width:.5em;height:.9em;background:var(--ink);vertical-align:-.08em;margin-left:4px;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .cta{
    justify-self:start;align-self:start;
    display:inline-flex;align-items:center;gap:10px;
    padding:12px 16px;border:1px solid var(--ink);
    transition:background .25s,color .25s;
  }
  .cta:hover{background:var(--ink);color:var(--bg)}
  .cta svg{transition:transform .25s}
  .cta:hover svg{transform:translateX(3px)}

  @keyframes fade{to{opacity:1}}

  /* Laufband */
  .ticker{
    border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
    overflow:hidden;white-space:nowrap;
    padding:10px 0;margin-top:clamp(32px,6vh,72px);
    opacity:0;animation:fade .8s ease forwards 1.8s;
    background:var(--bg);
  }
  .track{display:inline-block;animation:scroll 40s linear infinite}
  .track span{padding:0 22px}
  .track b{font-weight:400;color:var(--mute)}
  @keyframes scroll{to{transform:translateX(-50%)}}

  /* Fußzeile */
  footer{
    display:grid;grid-template-columns:repeat(4,1fr);
    padding:var(--pad);
    background:var(--bg);
  }
  footer > *{padding-left:10px}
  footer a{position:relative}
  footer a::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .3s}
  footer a:hover::after{transform:scaleX(1)}
  footer .legal{display:flex;gap:18px;flex-wrap:wrap}

  /* Mobil */
  @media (max-width:720px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .grid span:nth-child(n+3){display:none}
    .grid span:nth-child(2){border-right:1px solid var(--line)}
    header,footer{grid-template-columns:1fr 1fr;row-gap:8px}
    .sub{grid-template-columns:1fr;row-gap:22px}
    .tagline{grid-column:auto}
    .hide-m{display:none}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;animation-iteration-count:1!important}
    .track{animation:none}
  }
</style>
</head>
<body>

<div class="grid" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

<div class="page">
  <header>
    <span class="mark">UPFORMD</span>
    <span class="dim hide-m">Est. 2026</span>
    <span class="dim hide-m">München, DE</span>
    <span id="clock">--:--:-- MEZ</span>
  </header>

  <main>
    <div class="index">
      <span>( 001 )</span>
      <span class="dim">In Entstehung</span>
    </div>

    <h1 aria-label="UPFORMD">
      <span>U</span><span>P</span><span>F</span><span>O</span><span>R</span><span>M</span><span>D</span>
    </h1>

    <div class="rule"></div>

    <div class="sub">
      <p class="tagline">Something is taking form.<span class="cursor" aria-hidden="true"></span></p>
      <span class="dim hide-m">Coming Soon</span>
      <a class="cta" href="kontakt.html">
        Kontakt aufnehmen
        <svg width="14" height="10" viewBox="0 0 14 10" fill="none" aria-hidden="true"><path d="M0 5h12M8 1l4 4-4 4" stroke="currentColor" stroke-width="1.2"/></svg>
      </a>
    </div>
  </main>

  <div class="ticker" aria-hidden="true">
    <div class="track" id="track"></div>
  </div>

  <footer>
    <span>&copy; 2026</span>
    <span class="dim hide-m">48.1351° N — 11.5820° E</span>
    <a href="kontakt.html" class="hide-m">Kontakt</a>
    <span class="legal"><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a></span>
  </footer>
</div>

<script>
  // Laufband füllen (zweimal für nahtlose Schleife)
  (function(){
    var item = '<span>UPFORMD</span><b>—</b><span>Coming Soon</span><b>—</b><span>Taking Form</span><b>—</b><span>München 2026</span><b>—</b>';
    var half = '';
    for (var i = 0; i < 6; i++) half += item;
    document.getElementById('track').innerHTML = half + half;
  })();

  // Live-Uhr in Münchner Zeit
  (function(){
    var el = document.getElementById('clock');
    var fmt;
    try {
      fmt = new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
    } catch(e){ fmt = null; }
    function tick(){
      var d = new Date();
      el.textContent = (fmt ? fmt.format(d) : d.toTimeString().slice(0,8)) + ' MUC';
    }
    tick(); setInterval(tick,1000);
  })();
</script>
</body>
</html>
